name: Typecheck

# CI had no type gate — `tsc --noEmit` only ran in the local `npm run verify`
# script, so type regressions could merge (the E2E workflow transpiles specs
# without strict checks). This is a fast, browser-free gate that catches them.

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typecheck.yml'
  push:
    branches: [lifeosv1, main]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # `npm run typecheck` invokes tsc with `--stack-size=8000`. The default
      # Node stack overflows on our deep Drizzle types (RangeError: Maximum call
      # stack size exceeded) — reproducible locally on Node 22 and a latent
      # crash risk here — so we raise it. See package.json `typecheck` script.
      - name: typecheck (tsc --noEmit, raised stack)
        run: npm run typecheck
