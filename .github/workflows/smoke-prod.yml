name: Prod Smoke

# Read-only health check against the LIVE deployed site. Unlike the E2E
# workflow (which builds the branch and tests it on localhost to validate
# *changes*), this verifies the public production bundle still mounts every
# route without console errors. Safe to run anytime — it never writes data.

on:
  schedule:
    - cron: '0 7 * * *' # daily 07:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: smoke-prod
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The public production domain. Override via the env if the deploy URL
      # changes; the playwright `smoke`/`smoke-mobile` projects read this.
      SMOKE_BASE_URL: https://lifeos-6r5-eqa.pages.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Desktop + mobile viewport route walks against the live site. No build,
      # no Supabase secrets — the deployed bundle already has its env baked in.
      - name: Smoke (desktop)
        run: npx playwright test --project=smoke

      - name: Smoke (mobile viewport)
        run: npx playwright test --project=smoke-mobile

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
