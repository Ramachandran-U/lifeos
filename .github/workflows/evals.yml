name: AI Evals

on:
  pull_request:
    paths:
      - 'src/ai/**'
      - 'evals/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/evals.yml'
  push:
    branches: [lifeosv1, main]
    paths:
      - 'src/ai/**'
      - 'evals/**'

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run AI evals (mock mode)
        run: npm run evals
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/
