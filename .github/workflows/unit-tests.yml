name: Unit Tests

# Runs `npm test` — BOTH Jest projects: `node` (pure-logic, ts-jest) and
# `components` (jest-expo RN render tests). The components project was previously
# excluded because Expo 54's winter runtime failed to load under jest in a clean
# checkout; jest.setup.winter.js stubs the lazily-required winter modules so it
# now runs here too (issue #70).

on:
  pull_request:
    paths:
      - 'src/**'
      - 'workers/**'
      - 'jest.config.js'
      - 'jest.setup.winter.js'
      - 'jest.mocks/**'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unit-tests.yml'
  push:
    branches: [lifeosv1, main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: jest (node + components projects, with coverage gate)
        # --runInBand runs every suite in ONE process so coverage is instrumented
        # and merged deterministically. Under default multi-worker parallelism,
        # which worker happens to run a cross-importing suite (e.g. src/ai/* which
        # transitively imports src/finance/*) decides whether those lines land in
        # that worker's coverage map; the merged result then swings run-to-run by
        # up to ~11 pts on the finance/util/worker dirs. A single-process merge
        # removes that nondeterminism so the ratchet floors can sit tight against
        # the measured value instead of behind a wide noise buffer.
        run: npm test -- --coverage --runInBand
