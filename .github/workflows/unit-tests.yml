name: Unit Tests

# Runs the full Jest suite — both projects: `node` (pure-logic, ts-jest) and
# `components` (RN render tests via jest-expo). Until now NO workflow ran
# `npm test`, so the unit + component suites had no CI gate (only the evals
# subset ran). This closes that gap.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'workers/**'
      - 'jest.config.js'
      - 'jest.mocks/**'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unit-tests.yml'
  push:
    branches: [lifeosv1, main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: jest (node + components projects)
        run: npm test
