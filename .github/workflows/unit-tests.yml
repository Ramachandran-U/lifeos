name: Unit Tests

# Runs `npm test` — the `node` (pure-logic, ts-jest) Jest project. Until now NO
# workflow ran the unit suite (only the evals subset), so this closes that gap
# for 600+ tests. The `components` project (jest-expo RN render tests) runs
# locally via `npm run test:components` but is NOT gated here yet — Expo 54's
# winter runtime needs a jest-expo transform fix to run in a clean CI checkout.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'workers/**'
      - 'jest.config.js'
      - 'jest.mocks/**'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unit-tests.yml'
  push:
    branches: [lifeosv1, main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: jest (node + components projects)
        run: npm test
