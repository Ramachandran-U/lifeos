name: Unit Tests

# Runs `npm test` — BOTH Jest projects: `node` (pure-logic, ts-jest) and
# `components` (jest-expo RN render tests). The components project was previously
# excluded because Expo 54's winter runtime failed to load under jest in a clean
# checkout; jest.setup.winter.js stubs the lazily-required winter modules so it
# now runs here too (issue #70).

on:
  pull_request:
    paths:
      - 'src/**'
      - 'workers/**'
      - 'jest.config.js'
      - 'jest.setup.winter.js'
      - 'jest.mocks/**'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unit-tests.yml'
  push:
    branches: [lifeosv1, main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: jest (node + components projects)
        run: npm test
